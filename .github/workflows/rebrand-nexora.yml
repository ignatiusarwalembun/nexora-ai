name: Rebrand to Nexora AI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebrand-nexora.yml'

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace public branding
        shell: python
        run: |
          from pathlib import Path

          replacements = [
              ('Maba Business', 'Nexora AI'),
              ('maba business', 'nexora ai'),
              ('MABA BUSINESS', 'NEXORA AI'),
              ('Maba AI Chatbot', 'Nexora AI Chatbot'),
              ('MABA AI', 'NEXORA AI'),
              ('Maba AI', 'Nexora AI'),
              ('Maba Assistant', 'Nexora Assistant'),
              ('MABA Assistant', 'NEXORA Assistant'),
              ('Maba Studio', 'Nexora Studio'),
              ('MABA Studio', 'NEXORA Studio'),
          ]

          targets = [
              Path('frontend/index.html'),
              Path('frontend/app.js'),
              Path('frontend/widget.html'),
              Path('backend/server.js'),
              Path('backend/storage.js'),
              Path('README.md'),
              Path('package.json'),
          ]

          changed = []
          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'nothing')

      - name: Commit rebrand
        run: |
          if git diff --quiet; then
            echo "No branding changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend backend README.md package.json
          git commit -m "rebrand: Maba Business to Nexora AI"
          git push
