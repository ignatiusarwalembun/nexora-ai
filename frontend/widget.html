<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui;background:#0f100f;color:#fff;height:100vh}.box{height:100%;display:grid;grid-template-rows:auto 1fr auto;border:1px solid #292b27;border-radius:22px;overflow:hidden;background:#141514}.head{padding:17px 18px;border-bottom:1px solid #292b27;display:flex;gap:11px;align-items:center}.av{width:38px;height:38px;border-radius:12px;background:#d9ff43;color:#111;display:grid;place-items:center;font-weight:900}.head small{display:flex;align-items:center;gap:6px;color:#9da094;margin-top:2px}.dot{width:6px;height:6px;border-radius:50%;background:#75b24a}.dot.human{background:#ef9d56}.msgs{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:10px}.m{max-width:86%;padding:11px 13px;border-radius:15px;line-height:1.45;font-size:14px;background:#20221f}.m.u{align-self:flex-end;background:#d9ff43;color:#111}.m.h{background:#293126;border:1px solid #4b5d40}.form{padding:12px;border-top:1px solid #292b27;display:flex;gap:8px}.form input{flex:1;border:1px solid #30322f;background:#1b1c1a;color:#fff;border-radius:13px;padding:12px;outline:0;font-size:16px}.form button{width:43px;border:0;border-radius:13px;background:#d9ff43;font-size:18px;cursor:pointer}.form button:disabled{opacity:.5}.handoff-note{margin:0 18px 12px;padding:8px 10px;border:1px solid #4d3c2d;background:#241d17;border-radius:10px;color:#e6b688;font-size:10px;display:none}.handoff-note.show{display:block}
  </style>
</head>
<body>
  <div class="box">
    <div class="head"><div class="av">M</div><div><strong id="title">Nexora Assistant</strong><small><i class="dot" id="statusDot"></i><span id="statusText">AI • online</span></small></div></div>
    <div class="msgs" id="msgs"><div class="m">Halo 👋 Ada yang bisa saya bantu?</div></div>
    <div class="handoff-note" id="handoffNote">Human agent is connected. Your conversation context is preserved.</div>
    <form class="form" id="form"><input id="input" autocomplete="off" placeholder="Tulis pesan..."><button aria-label="Send">↑</button></form>
  </div>
<script>
const params=new URLSearchParams(location.search);const workspaceId=params.get('workspace')||'default';
const msgs=document.getElementById('msgs'),form=document.getElementById('form'),input=document.getElementById('input'),statusText=document.getElementById('statusText'),statusDot=document.getElementById('statusDot'),handoffNote=document.getElementById('handoffNote');
const sid='widget:'+Math.random().toString(36).slice(2)+Date.now().toString(36);const seenHuman=new Set();let humanMode=false;
function add(t,c=''){const d=document.createElement('div');d.className='m '+c;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}
function setMode(status){humanMode=['waiting','human'].includes(status);statusText.textContent=status==='human'?'Human agent • connected':status==='waiting'?'Human handoff • waiting':'AI • online';statusDot.classList.toggle('human',humanMode);handoffNote.classList.toggle('show',humanMode)}
fetch('/api/widget/config?workspaceId='+encodeURIComponent(workspaceId)).then(r=>r.json()).then(j=>{if(j.ok){document.getElementById('title').textContent=j.widget.title||j.assistantName||'Nexora Assistant';const accent=j.widget.accent||'#d9ff43';document.querySelector('.av').style.background=accent;document.querySelector('.form button').style.background=accent;const first=msgs.querySelector('.m');if(first)first.textContent=j.widget.welcomeMessage||first.textContent;}}).catch(()=>{});
async function pollHistory(){try{const r=await fetch('/api/chat/history?workspaceId='+encodeURIComponent(workspaceId)+'&sessionId='+encodeURIComponent(sid));const j=await r.json();if(!j.ok)return;setMode(j.status);for(const m of j.messages||[]){if(m.role==='human'&&!seenHuman.has(m.id)){seenHuman.add(m.id);add(m.content,'h')}}}catch{}}
setInterval(pollHistory,2400);
form.addEventListener('submit',async e=>{e.preventDefault();const m=input.value.trim();if(!m)return;add(m,'u');input.value='';const wait=document.createElement('div');wait.className='m';wait.textContent='•••';msgs.appendChild(wait);try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:m,sessionId:sid,channel:'website',workspaceId})});const j=await r.json();wait.remove();add(j.ok?j.text:(j.error||'AI belum dikonfigurasi.'));if(j.handoff)setMode(j.handoffStatus||'waiting');pollHistory();}catch{wait.remove();add('Tidak dapat terhubung ke Nexora AI.')}});
</script>
</body></html>
